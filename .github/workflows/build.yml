name: Сборка сайта
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Данные из Supabase
        env:
          SB: https://roqmejclibyyjlnxshzu.supabase.co
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvcW1lamNsaWJ5eWpsbnhzaHp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMzQ5OTcsImV4cCI6MjEwMTcxMDk5N30.Y4FhKvSa8b515buVumv3UTzX6mLti1aEmbrL38Jnvuc  # публичный anon-ключ, защита через RLS
        run: |
          for t in centr_site_tours centr_site_banners; do
            curl -fsS "$SB/rest/v1/$t?select=*&order=sort.asc" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o $t.json
          done
          python3 -c "import json;assert len(json.load(open('centr_site_tours.json')))>5"
      - name: Сборка
        run: |
          python3 -I src/gen.py src/template centr_site_tours.json centr_site_banners.json _site
          echo "centrvietnam.ru" > _site/CNAME
          touch _site/.nojekyll
      - name: Готовая сборка в ветку dist (её забирает сервер Reg.ru)
        run: |
          cd _site
          git init -q -b dist && git config user.name "site-build" && git config user.email "build@centrvietnam.ru"
          git add -A && git commit -qm "build $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
