.btn.jade{background:var(--jade)}.btn.line{background:#fff;color:var(--navy);border:1.5px solid var(--line)}.btn.red{background:#fff;color:var(--red);border:1.5px solid #f2c9c8}
.btn.sm{height:34px;padding:0 13px;font-size:13px}.btn.icon{width:34px;padding:0;justify-content:center}
.btn svg{width:16px;height:16px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 500px at 80% 0%,rgba(51,185,214,.35),transparent 60%),linear-gradient(150deg,var(--deep),var(--deep2));padding:20px}
.login-card{background:#fff;border-radius:24px;padding:36px;width:min(420px,100%);box-shadow:0 30px 60px -30px rgba(0,0,0,.5);display:grid;gap:14px}
.login-card h1{font-size:22px}.login-card p{margin:0;color:var(--muted);font-size:14px}
/* shell */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--deep);color:#cfe3dc;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 22px;color:#fff}
.brand i{width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,var(--deep2),var(--sea));display:grid;place-items:center;font-style:normal}
.brand b{font:700 14px/1.1 var(--display)}.brand small{display:block;font-size:11px;color:#8fb3a8;margin-top:3px}
.side a.nav{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:#cfe3dc;text-decoration:none;font-weight:700;cursor:pointer}
.side a.nav:hover{background:rgba(255,255,255,.07)}.side a.nav.on{background:#fff;color:var(--deep)}
.side a.nav svg{width:18px;height:18px}.side .cnt{margin-left:auto;background:var(--sun);color:#fff;border-radius:99px;font-size:11px;padding:1px 8px}
.side-f{margin-top:auto;font-size:12px;color:#8fb3a8;padding:8px;display:grid;gap:8px}
.mode{display:inline-block;padding:3px 9px;border-radius:99px;font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.mode.demo{background:#ffe6d3;color:#a54b0c}.mode.live{background:#d8f4e7;color:#0b6b46}
main{padding:28px 32px 60px;min-width:0}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.top h2{font-size:24px;margin-right:auto}
.search{height:42px;border-radius:999px;border:1.5px solid var(--line);background:#fff;padding:0 16px;width:260px}
.panel{background:#fff;border-radius:var(--r);box-shadow:0 6px 18px -12px rgba(11,34,54,.25)}
.note{background:#fff7ec;border:1px solid #ffdcb5;color:#7a3f0c;border-radius:12px;padding:12px 16px;font-size:14px;margin-bottom:18px}
/* list */
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:84px 1fr auto;gap:16px;align-items:center;padding:12px;background:#fff;border-radius:14px;box-shadow:0 4px 14px -10px rgba(11,34,54,.3)}
.thumb{width:84px;height:62px;border-radius:10px;background:linear-gradient(140deg,var(--sea),var(--deep2)) center/cover;flex:none}
.row b{display:block}.row .sub{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:3px}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--navy);text-transform:uppercase;letter-spacing:.04em}
.pill.off{background:#f3e3e3;color:var(--red)}.pill.hot{background:#ffe6d3;color:#a54b0c}
.acts{display:flex;gap:6px;align-items:center}
.sw{position:relative;width:40px;height:23px;flex:none}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:99px;background:#cfd9e0;cursor:pointer;transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--jade)}.sw input:checked+span::after{left:20px}
.swl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700}
/* editor */
.ed{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
.card{background:#fff;border-radius:var(--r);padding:22px;box-shadow:0 6px 18px -12px rgba(11,34,54,.25);margin-bottom:18px}
.card h3{font-size:15px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.f{display:grid;gap:5px;margin-bottom:12px}.f>span{font-size:12px;font-weight:800;color:var(--ink2);display:flex;justify-content:space-between}
.f>span em{font-style:normal;font-weight:600;color:var(--muted)}
.in{height:42px;border:1.5px solid var(--line);border-radius:11px;padding:0 12px;background:#fafcfd;width:100%}
textarea.in{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.in:focus{outline:0;border-color:var(--sea);background:#fff}
.hint{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats label{display:flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer}
.cats input:checked+i{color:var(--sea)}
.rep{display:grid;gap:8px}
.rep-i{display:grid;gap:8px;grid-template-columns:90px 1fr auto;align-items:start;background:var(--soft);border-radius:12px;padding:10px}
.rep-i.p{grid-template-columns:80px 1fr 1.5fr auto}.rep-i.v{grid-template-columns:1fr 70px 1fr 1.4fr auto}.rep-i.q{grid-template-columns:1fr auto}
.rep-i .in{background:#fff;height:38px}.rep-i textarea.in{min-height:38px;height:38px}
.rep-a{display:flex;gap:4px}
.img-prev{aspect-ratio:4/3;border-radius:12px;background:var(--soft) center/cover;margin-bottom:10px;display:grid;place-items:center;color:var(--muted);font-size:13px}
.sticky{position:sticky;top:20px}
.serp{border:1px solid var(--line);border-radius:12px;padding:14px;font-family:arial,sans-serif}
.serp .u{color:#202124;font-size:12px}.serp .t{color:#1a0dab;font-size:18px;line-height:1.3;margin:4px 0}.serp .d{color:#4d5156;font-size:13px}
/* banner preview */
.bprev{position:relative;border-radius:18px;overflow:hidden;min-height:220px;color:#fff;display:flex;align-items:flex-end;background:var(--navy) center/cover;isolation:isolate}
.bprev::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(6,30,52,.9),rgba(6,30,52,.35))}
.bprev[data-theme=teal]::before{background:linear-gradient(90deg,rgba(4,48,40,.9),rgba(4,48,40,.35))}
.bprev[data-theme=sunset]{background-image:linear-gradient(120deg,#ff8a3d,#e84a6f 60%,#7b3fa0)!important}.bprev[data-theme=sunset]::before{background:none}
.bprev div{padding:22px}.bprev .bd{display:inline-block;background:var(--sun);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:99px;margin-bottom:10px}
.bprev h4{font:700 20px/1.2 var(--display);margin:0 0 6px}.bprev p{margin:0 0 12px;color:rgba(255,255,255,.85);font-size:14px}
.bprev .cta{display:inline-block;background:var(--jade);padding:8px 14px;border-radius:99px;font-weight:700;font-size:13px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.bitem{background:#fff;border-radius:18px;padding:10px;box-shadow:0 6px 18px -12px rgba(11,34,54,.3)}
.bitem .bprev{min-height:170px}.bitem .bf{display:flex;align-items:center;gap:8px;padding:10px 4px 2px;flex-wrap:wrap}
/* leads */
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 14px;background:var(--soft)}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top}
.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);transform:translateY(120px);transition:.3s;z-index:99}
.toast.show{transform:none}.toast.err{background:var(--red)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.pub{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
.steps{margin:0;padding-left:20px;color:var(--ink2)}.steps li{margin-bottom:8px}
.mtop{display:none}
.modal{position:fixed;inset:0;z-index:100;background:rgba(6,30,26,.5);display:grid;place-items:center;padding:16px}.modal[hidden]{display:none}.modal-c{background:#fff;border-radius:18px;padding:24px;max-width:420px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}.modal-c p{margin:0 0 18px;font-weight:600}.modal-a{display:flex;gap:10px;justify-content:flex-end}
@media(max-width:980px){.shell{grid-template-columns:1fr}.side{position:fixed;inset:0 30% 0 0;z-index:50;transform:translateX(-100%);transition:.25s;height:auto}.side.open{transform:none}.mtop{display:inline-flex}.ed,.pub{grid-template-columns:1fr}main{padding:18px 14px 60px}.g3{grid-template-columns:1fr}.row{grid-template-columns:64px 1fr}.row .acts{grid-column:1/-1;flex-wrap:wrap}.thumb{width:64px;height:48px}.search{width:100%}.rep-i,.rep-i.v,.rep-i.p{grid-template-columns:1fr}}
</style>

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" hidden><div class="modal-c"><p id="modal-t"></p><div class="modal-a"><button class="btn line" id="modal-no">Отмена</button><button class="btn red" id="modal-yes" style="background:var(--red);color:#fff">Удалить</button></div></div></div>
<script type="module">
const CFG = window.CT_ADMIN || {};
const LIVE = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY);
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CATS = [['sea', 'Море и острова'], ['nature', 'Горы и природа'], ['kids', 'С детьми'], ['active', 'Активный отдых'], ['city', 'Города и культура'], ['multi', 'Туры на 2–3 дня']];
const I = {
  tours: '<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/>',
  promo: '<path d="M4 9v6h3l6 4V5L7 9H4z"/><path d="M17 9a4 4 0 0 1 0 6"/>',
  leads: '<path d="M4 5h16v11H8l-4 4z"/>',
  pub: '<path d="M12 3v12M7 8l5-5 5 5M5 21h14"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>', copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  del: '<path d="M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', up: '<path d="M12 19V5M6 11l6-6 6 6"/>', down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  back: '<path d="M19 12H5M11 6l-6 6 6 6"/>', ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>', menu: '<path d="M4 7h16M4 12h16M4 17h16"/>', out: '<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>'
};
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const ask = msg => new Promise(res => { const m = $('#modal'); $('#modal-t').textContent = msg; m.hidden = false; const done = v => { m.hidden = true; res(v); }; $('#modal-yes').onclick = () => done(true); $('#modal-no').onclick = () => done(false); });
const toast = (m, err) => { const t = $('#toast'); t.textContent = m; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 2600); };
const translit = s => s.toLowerCase().replace(/[ёе]/g, 'e').split('').map(c => ({ а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', ж: 'zh', з: 'z', и: 'i', й: 'y', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'h', ц: 'ts', ч: 'ch', ш: 'sh', щ: 'sch', ъ: '', ы: 'y', ь: '', э: 'e', ю: 'yu', я: 'ya' }[c] ?? c)).join('').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
const thumbUrl = u => u && u.includes('static.tildacdn.com') ? u.replace('static.tildacdn.com', 'thb.tildacdn.com').replace(/\/([^/]+)$/, '/-/resize/300x/$1') : u;

/* ---------------- data layer ---------------- */
let sb = null, session = null;
const api = {
  async init() {
    if (LIVE) {
      const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
      sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
      session = (await sb.auth.getSession()).data.session;
      sb.auth.onAuthStateChange((_e, s) => { session = s; });
    } else if (!localStorage.getItem('ct_demo_tours')) {
      const d = await fetch('demo.json').then(r => r.json()).catch(() => ({ tours: [], banners: [] }));
      localStorage.setItem('ct_demo_tours', JSON.stringify(d.tours));
      localStorage.setItem('ct_demo_banners', JSON.stringify(d.banners.map((b, i) => ({ ...b, id: b.id || 'b' + i }))));
      localStorage.setItem('ct_demo_leads', JSON.stringify([{ id: 1, created_at: new Date().toISOString(), name: 'Мария', contact: '+7 912 000-00-00', channel: 'WhatsApp', tour: 'Северные острова из Нячанга', date: null, people: '2 взрослых, ребёнок 5 лет', message: 'Без ранних выездов', page: '/north-islands', status: 'new' }]));
    }
  },
  async login(email, password) {
    if (!LIVE) { session = { user: { email: email || 'demo@centrvietnam.ru' } }; return; }
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    session = data.session;
    const { data: ok } = await sb.rpc('centr_site_is_admin');
    if (!ok) { await sb.auth.signOut(); session = null; throw new Error('Этот e-mail не добавлен в centr_site_admins'); }
  },
  async logout() { if (LIVE) await sb.auth.signOut(); session = null; },
  key: t => t === 'centr_site_tours' ? 'slug' : 'id',
  local: t => 'ct_demo_' + t.replace('ct_', ''),
  async list(t) {
    if (!LIVE) return JSON.parse(localStorage.getItem(api.local(t)) || '[]').sort((a, b) => t === 'centr_site_leads' ? b.id - a.id : (a.sort ?? 0) - (b.sort ?? 0));
    const order = t === 'centr_site_leads' ? 'created_at' : 'sort';
    const { data, error } = await sb.from(t).select('*').order(order, { ascending: t !== 'centr_site_leads' }).limit(500);
    if (error) throw error; return data;
  },
  async save(t, row, oldKey) {
    const k = api.key(t);
    if (!LIVE) {
      const list = JSON.parse(localStorage.getItem(api.local(t)) || '[]');
      if (!row[k]) row[k] = t === 'centr_site_leads' ? Date.now() : 'b' + Date.now().toString(36);
      const i = list.findIndex(x => x[k] === (oldKey ?? row[k]));
      row.updated_at = new Date().toISOString();
      i >= 0 ? list[i] = { ...list[i], ...row } : list.push(row);
      localStorage.setItem(api.local(t), JSON.stringify(list)); return row;
    }
    if (oldKey && oldKey !== row[k]) {
      const { error } = await sb.from(t).update(row).eq(k, oldKey); if (error) throw error; return row;
    }
    const { data, error } = await sb.from(t).upsert(row).select().single();
    if (error) throw error; return data;
  },
  async patch(t, key, fields) {
    if (!LIVE) return api.save(t, { [api.key(t)]: key, ...fields });
    const { error } = await sb.from(t).update(fields).eq(api.key(t), key); if (error) throw error;
  },
  async remove(t, key) {
    if (!LIVE) { const k = api.key(t); localStorage.setItem(api.local(t), JSON.stringify(JSON.parse(localStorage.getItem(api.local(t)) || '[]').filter(x => x[k] !== key))); return; }
    const { error } = await sb.from(t).delete().eq(api.key(t), key); if (error) throw error;
  },
  async upload(file) {
    if (file.size > 5 * 1024 * 1024) throw new Error('Файл больше 5 МБ');
    if (!LIVE) return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${new Date().toISOString().slice(0, 7)}/${crypto.randomUUID()}.${ext}`;
    const { error } = await sb.storage.from(CFG.BUCKET || 'ct-media').upload(path, file, { cacheControl: '31536000', contentType: file.type });
    if (error) throw error;
    return sb.storage.from(CFG.BUCKET || 'ct-media').getPublicUrl(path).data.publicUrl;
  },
  async publish() {
    if (LIVE) await sb.from('centr_site_builds').insert({ requested_by: session?.user?.email });
    if (!CFG.BUILD_WEBHOOK) throw new Error('BUILD_WEBHOOK не настроен в admin/config.js');
    const r = await fetch(CFG.BUILD_WEBHOOK, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (session?.access_token || '') }, body: JSON.stringify({ site: 'centrvietnam', by: session?.user?.email }) });
    if (!r.ok) throw new Error('Сервер сборки ответил ' + r.status);
  }
};

/* ---------------- views ---------------- */
const state = { view: 'tours', tours: [], banners: [], leads: [] };
const app = $('#app');

  $('#lf').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    try { await api.login(f.get('email'), f.get('password')); await boot(); } catch (err) { $('#lerr').textContent = err.message; }
  };
}

const topbar = (title, right = '') => `<div class="top"><button class="btn line icon mtop" data-menu>${ic('menu')}</button><h2>${title}</h2>${right}</div>`;
const demoNote = () => LIVE ? '' : `<div class="note"><b>Демо-режим.</b> Подключите Supabase в <code>admin/config.js</code> — тогда туры и баннеры будут сохраняться в базе и публиковаться на сайт.</div>`;

async function go(view, arg) {
  state.view = view;
  if (view === 'tours') return toursView();
  if (view === 'tour') return tourEditor(arg);
  if (view === 'banners') return bannersView();
  if (view === 'banner') return bannerEditor(arg);
  if (view === 'leads') return leadsView();
  if (view === 'publish') return publishView();
}

/* ---- tours ---- */
function toursView(q = '') {
  const list = state.tours.filter(t => !q || (t.title + t.slug).toLowerCase().includes(q.toLowerCase()));
  shell(topbar('Туры', `<input class="search" id="q" placeholder="Поиск по названию…" value="${esc(q)}"><button class="btn jade" data-new>${ic('plus')}Новый тур</button>`) + demoNote() +
    `<div class="rows">${list.map(t => `<div class="row" data-slug="${esc(t.slug)}">
      <div class="thumb" style="${t.image ? `background-image:url('${esc(thumbUrl(t.image))}')` : ''}"></div>
      <div><b>${esc(t.title)}</b><div class="sub"><span>${esc(t.price_label || '$' + t.price_from)}</span><span>${esc(t.duration)}</span><span>/${esc(t.slug)}</span>${t.badge ? `<span class="pill hot">${esc(t.badge)}</span>` : ''}${t.published === false ? '<span class="pill off">Скрыт</span>' : ''}</div></div>
      <div class="acts">
        <label class="swl" title="Показывать на сайте"><span class="sw"><input type="checkbox" data-pub ${t.published !== false ? 'checked' : ''}><span></span></span>На сайте</label>
        <label class="swl" title="Показывать на главной"><span class="sw"><input type="checkbox" data-feat ${t.featured ? 'checked' : ''}><span></span></span>Главная</label>
        <button class="btn line sm icon" data-mv="-1" title="Выше">${ic('up')}</button><button class="btn line sm icon" data-mv="1" title="Ниже">${ic('down')}</button>
        <button class="btn line sm icon" data-dup title="Дублировать">${ic('copy')}</button>
        <button class="btn sm" data-edit>${ic('edit')}Изменить</button>
      </div></div>`).join('') || '<div class="empty panel">Туров пока нет</div>'}</div>`);
  $('#q').oninput = e => { const v = e.target.value, pos = e.target.selectionStart; toursView(v); const i = $('#q'); i.focus(); i.setSelectionRange(pos, pos); };
  $('[data-new]').onclick = () => go('tour', null);
  $$('.row').forEach(r => {
    const slug = r.dataset.slug, t = state.tours.find(x => x.slug === slug);
    $('[data-edit]', r).onclick = () => go('tour', slug);
    $('[data-pub]', r).onchange = async e => { t.published = e.target.checked; await api.patch('centr_site_tours', slug, { published: t.published }); toast(t.published ? 'Тур показан на сайте' : 'Тур скрыт'); };
    $('[data-feat]', r).onchange = async e => { t.featured = e.target.checked; await api.patch('centr_site_tours', slug, { featured: t.featured }); toast('Сохранено'); };
    $('[data-dup]', r).onclick = () => { const c = structuredClone(t); c.slug = t.slug + '-copy'; c.title += ' (копия)'; c.published = false; go('tour', { draft: c }); };
    $$('[data-mv]', r).forEach(b => b.onclick = async () => {
      const i = state.tours.indexOf(t), j = i + +b.dataset.mv; if (j < 0 || j >= state.tours.length) return;
      [state.tours[i], state.tours[j]] = [state.tours[j], state.tours[i]];
      state.tours.forEach((x, k) => x.sort = k + 1);
      await Promise.all([state.tours[i], state.tours[j]].map(x => api.patch('centr_site_tours', x.slug, { sort: x.sort })));
      toursView(q);
    });
  });
}

const blankTour = () => ({ slug: '', title: '', short: '', categories: [], badge: '', price_from: 0, price_label: '', duration: '1 день', time: '', image: '', highlights: [], audience: '', variants: [], program: [], included: ['Трансфер от отеля и обратно', 'Русскоязычный гид', 'Входные билеты'], excluded: ['Напитки и личные расходы'], bring: [], faq: [], featured: false, published: true, sort: state.tours.length + 1, seo_title: '', seo_description: '' });
const lines = a => (a || []).join('\n');
const unlines = s => s.split('\n').map(x => x.trim()).filter(Boolean);

function tourEditor(arg) {
  const isNew = !arg || arg.draft;
  const t = arg?.draft || (arg ? structuredClone(state.tours.find(x => x.slug === arg)) : blankTour());
  const oldSlug = isNew ? null : t.slug;
  let slugTouched = !isNew;
  const rep = (key, cls, fields) => `<div class="rep" data-rep="${key}">${(t[key] || []).map((it, i) => repItem(key, cls, fields, it, i)).join('')}</div><button type="button" class="btn line sm" data-add="${key}" style="margin-top:8px">${ic('plus')}Добавить</button>`;
  const repItem = (key, cls, fields, it, i) => `<div class="rep-i ${cls}" data-i="${i}">${fields.map(([f, ph, ta]) => ta ? `<textarea class="in" data-f="${f}" placeholder="${ph}">${esc(it[f])}</textarea>` : `<input class="in" data-f="${f}" placeholder="${ph}" value="${esc(it[f])}">`).join('')}<div class="rep-a"><button type="button" class="btn line sm icon" data-up title="Выше">${ic('up')}</button><button type="button" class="btn red sm icon" data-rm title="Удалить">${ic('del')}</button></div></div>`;
  const REP = { program: ['p', [['time', 'Время'], ['title', 'Название точки'], ['text', 'Описание', 1]]], variants: ['v', [['name', 'Вариант'], ['price', '$'], ['duration', 'Длительность'], ['note', 'Что входит', 1]]], faq: ['q', [['q', 'Вопрос'], ['a', 'Ответ', 1]]] };
  

  shell(topbar(isNew ? 'Новый тур' : 'Редактирование тура', `<button class="btn line" data-back>${ic('back')}К списку</button>${!isNew ? `<a class="btn line" target="_blank" href="${esc((CFG.SITE_URL || '') + '/' + t.slug)}">${ic('ext')}На сайте</a><button class="btn red" data-del>${ic('del')}</button>` : ''}<button class="btn jade" data-save>Сохранить</button>`) + `
  <form class="ed" id="tf" onsubmit="return false">
    <div>
      <div class="card"><h3>Основное</h3>
        <label class="f"><span>Название</span><input class="in" name="title" value="${esc(t.title)}" required placeholder="Экскурсия в Далат из Нячанга"></label>
        <div class="g2"><label class="f"><span>Адрес страницы (slug)</span><input class="in" name="slug" value="${esc(t.slug)}" pattern="[a-z0-9-]+" required placeholder="dalat"></label>
        <label class="f"><span>Бейдж на карточке</span><input class="in" name="badge" value="${esc(t.badge)}" placeholder="Хит сезона, Новинка…"></label></div>
        <p class="hint">Адрес будет: ${esc(CFG.SITE_URL || '')}/<b id="slugv">${esc(t.slug || '…')}</b>. Не меняйте его у опубликованных туров — потеряются позиции в поиске.</p>
        <label class="f"><span>Краткое описание <em id="sc"></em></span><textarea class="in" name="short" rows="3" placeholder="2 предложения: что увидите и чем экскурсия особенная">${esc(t.short)}</textarea></label>
        <label class="f"><span>Полное описание <em>выводится на странице слово в слово</em></span><textarea class="in" name="description" rows="14" placeholder="Оригинальный текст экскурсии">${esc(t.description || '')}</textarea></label>
        <label class="f"><span>Памятка туристу <em>необязательно, выводится отдельным блоком</em></span><textarea class="in" name="memo" rows="8" placeholder="Время выезда, что взять с собой, доп. расходы…">${esc(t.memo || '')}</textarea></label>
        <div class="f"><span>Категории</span><div class="cats">${CATS.map(([id, n]) => `<label><input type="checkbox" name="cat" value="${id}" ${t.categories?.includes(id) ? 'checked' : ''}>${n}</label>`).join('')}</div></div>
      </div>
      <div class="card"><h3>Цена и время</h3>
        <div class="g3"><label class="f"><span>Цена от, $</span><input class="in" name="price_from" type="number" min="0" value="${t.price_from ?? 0}"></label>
        <label class="f"><span>Как показывать цену</span><input class="in" name="price_label" value="${esc(t.price_label)}" placeholder="$45–99"></label>
        <label class="f"><span>Детская цена, $</span><input class="in" name="price_child" type="number" min="0" value="${t.price_child ?? ''}"></label></div>
        <div class="g2"><label class="f"><span>Длительность</span><input class="in" name="duration" value="${esc(t.duration)}" placeholder="1 день"></label>
        <label class="f"><span>Время</span><input class="in" name="time" value="${esc(t.time)}" placeholder="07:00–19:00"></label></div>
        <label class="f"><span>Кому подойдёт</span><input class="in" name="audience" value="${esc(t.audience)}" placeholder="Семьям с детьми"></label>
        <div class="f"><span>Варианты программы (если несколько)</span>${rep('variants', 'v', REP.variants[1])}</div>
      </div>
      <div class="card"><h3>Программа по шагам</h3>${rep('program', 'p', REP.program[1])}</div>
      <div class="card"><h3>Списки</h3>
        <div class="g2"><label class="f"><span>Главное в программе <em>по строке</em></span><textarea class="in" name="highlights" rows="6">${esc(lines(t.highlights))}</textarea></label>
        <label class="f"><span>Что взять с собой <em>по строке</em></span><textarea class="in" name="bring" rows="6">${esc(lines(t.bring))}</textarea></label>
        <label class="f"><span>Входит в цену <em>по строке</em></span><textarea class="in" name="included" rows="6">${esc(lines(t.included))}</textarea></label>
        <label class="f"><span>Оплачивается отдельно <em>по строке</em></span><textarea class="in" name="excluded" rows="6">${esc(lines(t.excluded))}</textarea></label></div>
      </div>
      <div class="card"><h3>Вопросы и ответы</h3><p class="hint">Попадают в FAQ-разметку — их цитируют Яндекс Нейро, Google и ChatGPT. Пишите прямой ответ в первом предложении.</p>${rep('faq', 'q', REP.faq[1])}</div>
    </div>
    <div class="sticky">
      <div class="card"><h3>Фото</h3>
        <div class="img-prev" id="ip" style="${t.image ? `background-image:url('${esc(thumbUrl(t.image))}')` : ''}">${t.image ? '' : 'Нет фото'}</div>
        <label class="f"><span>Ссылка на фото</span><input class="in" name="image" value="${esc(t.image)}" placeholder="https://…"></label>
        <label class="btn line sm" style="cursor:pointer">${ic('pub')}Загрузить с компьютера<input type="file" accept="image/*" id="upl" hidden></label>
        <p class="hint" style="margin-top:10px">Горизонтальное фото от 1600 px, до 5 МБ.</p>
      </div>
      <div class="card"><h3>Публикация</h3>
        <label class="swl" style="margin-bottom:10px"><span class="sw"><input type="checkbox" name="published" ${t.published !== false ? 'checked' : ''}><span></span></span>Показывать на сайте</label>
        <label class="swl"><span class="sw"><input type="checkbox" name="featured" ${t.featured ? 'checked' : ''}><span></span></span>В блоке «Популярные» на главной</label>
      </div>
      <div class="card"><h3>SEO</h3>
        <label class="f"><span>Title <em id="tc"></em></span><input class="in" name="seo_title" value="${esc(t.seo_title || '')}" placeholder="Пусто = сгенерируется автоматически"></label>
        <label class="f"><span>Description <em id="dc"></em></span><textarea class="in" name="seo_description" rows="3" placeholder="Пусто = краткое описание">${esc(t.seo_description || '')}</textarea></label>
        <div class="serp"><div class="u">centrvietnam.ru › <span id="su"></span></div><div class="t" id="st"></div><div class="d" id="sd"></div></div>
      </div>
    </div>
  </form>`);
  const f = $('#tf');
  const read = () => {
    const d = Object.fromEntries(new FormData(f));
    const o = { ...t, title: d.title.trim(), slug: d.slug.trim(), badge: d.badge.trim(), short: d.short.trim(), description: (d.description || '').replace(/\r/g, '').trim(), memo: (d.memo || '').replace(/\r/g, '').trim(), categories: $$('[name=cat]:checked', f).map(x => x.value),
      price_from: +d.price_from || 0, price_label: d.price_label.trim() || '$' + (+d.price_from || 0), price_child: d.price_child ? +d.price_child : null,
      duration: d.duration.trim(), time: d.time.trim(), audience: d.audience.trim(), image: d.image.trim(),
      highlights: unlines(d.highlights), bring: unlines(d.bring), included: unlines(d.included), excluded: unlines(d.excluded),
      published: !!d.published, featured: !!d.featured, seo_title: d.seo_title.trim() || null, seo_description: d.seo_description.trim() || null };
    for (const key of ['program', 'variants', 'faq']) o[key] = $$(`[data-rep=${key}] .rep-i`, f).map(r => Object.fromEntries($$('[data-f]', r).map(x => [x.dataset.f, x.dataset.f === 'price' ? +x.value || 0 : x.value.trim()]))).filter(x => Object.values(x).some(Boolean));
    
    return o;
  };
  const sync = () => {
    const o = read();
    $('#slugv').textContent = o.slug || '…';
    $('#sc').textContent = o.short.length + ' / 220';
    const auto = `${o.title}: цена ${o.price_label}, программа ${new Date().getFullYear()}`; const title = o.seo_title || (auto.length <= 54 ? auto + ' | Центр Туризма' : auto);
    const desc = o.seo_description || o.short;
    $('#tc').textContent = title.length + ' / 70'; $('#dc').textContent = desc.length + ' / 160';
    $('#su').textContent = o.slug; $('#st').textContent = title.slice(0, 70) + (title.length > 70 ? '…' : ''); $('#sd').textContent = desc.slice(0, 160) + (desc.length > 160 ? '…' : '');
    t.program = o.program; t.variants = o.variants; t.faq = o.faq;
  };
  f.addEventListener('input', e => {
    if (e.target.name === 'slug') slugTouched = true;
    if (e.target.name === 'title' && !slugTouched) f.slug.value = translit(e.target.value);
    if (e.target.name === 'image') { $('#ip').style.backgroundImage = `url('${thumbUrl(e.target.value)}')`; $('#ip').textContent = ''; }
    sync();
  });
  f.addEventListener('click', e => {
    const add = e.target.closest('[data-add]'), rm = e.target.closest('[data-rm]'), up = e.target.closest('[data-up]');
    if (add) { sync(); const k = add.dataset.add; t[k] = [...(t[k] || []), {}]; const [cls, fields] = k === 'program' ? REP.program : k === 'faq' ? REP.faq : REP.variants; $(`[data-rep=${k}]`, f).insertAdjacentHTML('beforeend', repItem(k, cls, fields, {}, t[k].length - 1)); }
    if (rm) { rm.closest('.rep-i').remove(); sync(); }
    if (up) { const it = up.closest('.rep-i'); it.previousElementSibling && it.parentNode.insertBefore(it, it.previousElementSibling); sync(); }
  });
  $('#upl').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    try { toast('Загружаю…'); const url = await api.upload(file); f.image.value = url; $('#ip').style.backgroundImage = `url('${url}')`; $('#ip').textContent = ''; toast('Фото загружено'); } catch (err) { toast(err.message, 1); }
  };
  $('[data-back]').onclick = () => go('tours');
  $('[data-del]') && ($('[data-del]').onclick = async () => {
    if (!await ask(`Удалить тур «${t.title}» навсегда? Чтобы просто убрать с сайта, выключите «Показывать на сайте».`)) return;
    await api.remove('centr_site_tours', oldSlug); state.tours = state.tours.filter(x => x.slug !== oldSlug); toast('Тур удалён'); go('tours');
  });
  $('[data-save]').onclick = async () => {
    const o = read();
    if (!o.title || !/^[a-z0-9-]+$/.test(o.slug)) return toast('Заполните название и латинский slug', 1);
    if ((isNew || o.slug !== oldSlug) && state.tours.some(x => x.slug === o.slug)) return toast('Такой slug уже занят', 1);
    delete o.created_at; delete o.updated_at;
    try {
      const saved = await api.save('centr_site_tours', o, oldSlug);
      const i = state.tours.findIndex(x => x.slug === (oldSlug ?? o.slug));
      i >= 0 ? state.tours[i] = { ...o, ...saved } : state.tours.push({ ...o, ...saved });
      toast('Тур сохранён. Нажмите «Публикация», чтобы обновить сайт'); go('tour', o.slug);
    } catch (err) { toast(err.message, 1); }
  };
  sync();
}

/* ---- banners ---- */
const bPrev = b => `<div class="bprev" data-theme="${esc(b.theme || 'ocean')}" style="${b.image ? `background-image:url('${esc(thumbUrl(b.image).replace('/300x/', '/800x/'))}')` : ''}"><div>${b.badge ? `<span class="bd">${esc(b.badge)}</span>` : ''}<h4>${esc(b.title || 'Заголовок акции')}</h4>${b.subtitle ? `<p>${esc(b.subtitle)}</p>` : ''}${b.link ? `<span class="cta">${esc(b.cta || 'Подробнее')} →</span>` : ''}</div></div>`;
const bStatus = b => { const now = new Date().toISOString(); if (!b.active) return '<span class="pill off">Выключен</span>'; if (b.starts_at && b.starts_at > now) return '<span class="pill">Запланирован</span>'; if (b.ends_at && b.ends_at < now) return '<span class="pill off">Истёк</span>'; return '<span class="pill" style="background:#d8f4e7;color:#0b6b46">Показывается</span>'; };
function bannersView() {
  shell(topbar('Акции и баннеры', `<button class="btn jade" data-new>${ic('plus')}Новая акция</button>`) + demoNote() +
    `<p class="hint" style="margin:-8px 0 18px">«Слайдер» — карусель акций на главной и странице /akcii. «Полоса» — широкий призыв между блоками. Изменения баннеров появляются на сайте сразу, без пересборки.</p>
    <div class="bgrid">${state.banners.map(b => `<div class="bitem" data-id="${esc(b.id)}">${bPrev(b)}<div class="bf">${bStatus(b)}<span class="pill">${b.placement === 'strip' ? 'Полоса' : 'Слайдер'}</span><span style="margin-left:auto"></span><label class="swl"><span class="sw"><input type="checkbox" data-act ${b.active ? 'checked' : ''}><span></span></span></label><button class="btn sm" data-edit>${ic('edit')}Изменить</button></div></div>`).join('') || '<div class="empty panel">Акций пока нет</div>'}</div>`);
  $('[data-new]').onclick = () => go('banner', null);
  $$('.bitem').forEach(el => {
    const b = state.banners.find(x => String(x.id) === el.dataset.id);
    $('[data-edit]', el).onclick = () => go('banner', b.id);
    $('[data-act]', el).onchange = async e => { b.active = e.target.checked; await api.patch('centr_site_banners', b.id, { active: b.active }); toast(b.active ? 'Акция включена' : 'Акция выключена'); bannersView(); };
  });
}
function bannerEditor(id) {
  const isNew = id == null;
  const b = isNew ? { placement: 'hero', badge: 'Акция', title: '', subtitle: '', cta: 'Подробнее', link: '', image: '', theme: 'ocean', active: true, sort: state.banners.length + 1, starts_at: null, ends_at: null } : structuredClone(state.banners.find(x => x.id === id));
  const dt = v => v ? new Date(v).toISOString().slice(0, 16) : '';
  shell(topbar(isNew ? 'Новая акция' : 'Редактирование акции', `<button class="btn line" data-back>${ic('back')}К списку</button>${!isNew ? `<button class="btn red" data-del>${ic('del')}</button>` : ''}<button class="btn jade" data-save>Сохранить</button>`) + `
  <form class="ed" id="bf" onsubmit="return false">
    <div><div class="card"><h3>Текст</h3>
      <div class="g2"><label class="f"><span>Где показывать</span><select class="in" name="placement"><option value="hero" ${b.placement === 'hero' ? 'selected' : ''}>Слайдер акций</option><option value="strip" ${b.placement === 'strip' ? 'selected' : ''}>Полоса-призыв</option></select></label>
      <label class="f"><span>Бейдж</span><input class="in" name="badge" value="${esc(b.badge)}" placeholder="Акция недели, −10%…"></label></div>
      <label class="f"><span>Заголовок</span><input class="in" name="title" value="${esc(b.title)}" required placeholder="Далат NEW за $35"></label>
      <label class="f"><span>Подзаголовок</span><textarea class="in" name="subtitle" rows="2">${esc(b.subtitle)}</textarea></label>
      <div class="g2"><label class="f"><span>Текст кнопки</span><input class="in" name="cta" value="${esc(b.cta)}"></label>
      <label class="f"><span>Ссылка</span><input class="in" name="link" value="${esc(b.link)}" list="tourlinks" placeholder="/dalat или https://…"></label></div>
      <datalist id="tourlinks">${state.tours.map(t => `<option value="/${esc(t.slug)}">${esc(t.title)}</option>`).join('')}</datalist>
    </div>
    <div class="card"><h3>Показ</h3>
      <div class="g2"><label class="f"><span>Начало показа</span><input class="in" type="datetime-local" name="starts_at" value="${dt(b.starts_at)}"></label>
      <label class="f"><span>Окончание</span><input class="in" type="datetime-local" name="ends_at" value="${dt(b.ends_at)}"></label></div>
      <p class="hint">Пусто = показывать без ограничений. По окончании акция скроется сама.</p>
      <div class="g2"><label class="f"><span>Порядок</span><input class="in" type="number" name="sort" value="${b.sort ?? 1}"></label>
      <label class="f"><span>Цвет</span><select class="in" name="theme"><option value="ocean" ${b.theme === 'ocean' ? 'selected' : ''}>Океан (синий)</option><option value="teal" ${b.theme === 'teal' ? 'selected' : ''}>Джунгли (изумруд)</option><option value="sunset" ${b.theme === 'sunset' ? 'selected' : ''}>Закат (без фото)</option></select></label></div>
      <label class="swl"><span class="sw"><input type="checkbox" name="active" ${b.active ? 'checked' : ''}><span></span></span>Акция включена</label>
    </div></div>
    <div class="sticky"><div class="card"><h3>Превью</h3><div id="bp">${bPrev(b)}</div></div>
      <div class="card"><h3>Фото</h3><label class="f"><span>Ссылка на фото</span><input class="in" name="image" value="${esc(b.image)}"></label>
      <label class="btn line sm" style="cursor:pointer">${ic('pub')}Загрузить<input type="file" accept="image/*" id="upl" hidden></label></div></div>
  </form>`);
  const f = $('#bf');
  const read = () => { const d = Object.fromEntries(new FormData(f)); return { ...b, placement: d.placement, badge: d.badge.trim(), title: d.title.trim(), subtitle: d.subtitle.trim(), cta: d.cta.trim(), link: d.link.trim(), image: d.image.trim(), theme: d.theme, sort: +d.sort || 1, active: !!d.active, starts_at: d.starts_at ? new Date(d.starts_at).toISOString() : null, ends_at: d.ends_at ? new Date(d.ends_at).toISOString() : null }; };
  f.oninput = () => $('#bp').innerHTML = bPrev(read());
  $('#upl').onchange = async e => { const file = e.target.files[0]; if (!file) return; try { toast('Загружаю…'); f.image.value = await api.upload(file); f.oninput(); toast('Фото загружено'); } catch (err) { toast(err.message, 1); } };
  $('[data-back]').onclick = () => go('banners');
  $('[data-del]') && ($('[data-del]').onclick = async () => { if (!await ask('Удалить акцию? Это действие нельзя отменить.')) return; await api.remove('centr_site_banners', b.id); state.banners = state.banners.filter(x => x.id !== b.id); toast('Удалено'); go('banners'); });
  $('[data-save]').onclick = async () => {
    const o = read(); if (!o.title) return toast('Введите заголовок', 1);
    delete o.created_at; delete o.updated_at; if (isNew && LIVE) delete o.id;
    try { const saved = await api.save('centr_site_banners', o); const i = state.banners.findIndex(x => x.id === saved.id); i >= 0 ? state.banners[i] = saved : state.banners.push(saved); state.banners.sort((a, c) => a.sort - c.sort); toast('Акция сохранена'); go('banners'); } catch (err) { toast(err.message, 1); }
  };
}

/* ---- leads ---- */
function leadsView() {
  const ST = [['new', 'Новая'], ['in_work', 'В работе'], ['booked', 'Забронировал'], ['rejected', 'Отказ']];
  shell(topbar('Заявки с сайта', `<span class="hint" style="margin:0">${state.leads.length} всего</span>`) + demoNote() + `<div class="panel" style="overflow:auto"><table><thead><tr><th>Дата</th><th>Клиент</th><th>Тур</th><th>Детали</th><th>Статус</th></tr></thead><tbody>
    ${state.leads.map(l => `<tr data-id="${l.id}"><td style="white-space:nowrap">${new Date(l.created_at).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</td>
      <td><b>${esc(l.name || '—')}</b><br>${esc(l.contact)}<br><span class="pill">${esc(l.channel || '')}</span></td>
      <td>${esc(l.tour || '—')}<br><small style="color:var(--muted)">${esc(l.page || '')}</small></td>
      <td>${l.date ? esc(l.date) + '<br>' : ''}${esc(l.people || '')}<br><small>${esc(l.message || '')}</small></td>
      <td><select class="in" data-st style="height:36px">${ST.map(([v, n]) => `<option value="${v}" ${l.status === v ? 'selected' : ''}>${n}</option>`).join('')}</select></td></tr>`).join('') || '<tr><td colspan="5" class="empty">Заявок пока нет</td></tr>'}
  </tbody></table></div>`);
  $$('tr[data-id]').forEach(r => $('[data-st]', r).onchange = async e => { const l = state.leads.find(x => String(x.id) === r.dataset.id); l.status = e.target.value; await api.patch('centr_site_leads', l.id, { status: l.status }); toast('Статус обновлён'); });
}

/* ---- publish ---- */
function publishView() {
  shell(topbar('Публикация') + demoNote() + `<div class="pub">
    <div class="card"><h3>Обновить сайт</h3>
      <p>Сайт — это статические HTML-страницы: они открываются мгновенно и идеально индексируются. После правок туров нажмите кнопку — сервер пересоберёт страницы, sitemap, llms.txt и разметку Schema.org (около 2 секунд).</p>
      <button class="btn jade" id="pubb" style="height:50px">${ic('pub')}Опубликовать изменения</button>
      <p class="hint" style="margin-top:14px">Акции и баннеры показываются сразу, без пересборки. Новые туры и правки цен — после публикации.</p>
      <p id="pubr"></p>
    </div>
    <div class="card"><h3>Как это работает</h3><ol class="steps">
      <li>Правки сохраняются в Supabase (проект «tourizm»).</li>
      <li>Кнопка вызывает защищённый webhook n8n на сервере.</li>
      <li>n8n проверяет, что вы администратор, и запускает <code>node build.mjs</code>.</li>
      <li>Caddy отдаёт обновлённые страницы, поисковики получают свежий sitemap.</li>
    </ol></div></div>`);
  $('#pubb').onclick = async e => {
    e.target.disabled = true; $('#pubr').textContent = 'Отправляю запрос на сборку…';
    try { await api.publish(); $('#pubr').innerHTML = '<b style="color:var(--jade)">Готово! Сайт обновится через несколько секунд.</b>'; toast('Публикация запущена'); }
    catch (err) { $('#pubr').innerHTML = `<b style="color:var(--red)">${esc(err.message)}</b>`; }
    e.target.disabled = false;
  };
}

async function boot() {
  try {
    [state.tours, state.banners, state.leads] = await Promise.all([api.list('centr_site_tours'), api.list('centr_site_banners'), api.list('centr_site_leads')]);
  } catch (err) { toast('Ошибка загрузки: ' + err.message, 1); }
  go('tours');
}
